<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <radialGradient id="chestAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="50%" stop-color="#583101"/>
      <stop offset="100%" stop-color="#381d00"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <!-- Aura -->
  <circle cx="24" cy="24" r="22" fill="url(#chestAura)"/>
  <!-- Chest Base -->
  <rect x="8" y="20" width="32" height="22" rx="3" fill="url(#woodGrad)" stroke="#1e1005" stroke-width="1.5"/>
  <!-- Chest Lid -->
  <path d="M 6 20 C 6 12, 42 12, 42 20 Z" fill="url(#woodGrad)" stroke="#1e1005" stroke-width="1.5"/>
  <!-- Gold Straps / Trim -->
  <rect x="12" y="16" width="4" height="26" fill="url(#goldGrad)" stroke="#713f12" stroke-width="0.8"/>
  <rect x="32" y="16" width="4" height="26" fill="url(#goldGrad)" stroke="#713f12" stroke-width="0.8"/>
  <rect x="6" y="19" width="36" height="3" fill="url(#goldGrad)" stroke="#713f12" stroke-width="0.8"/>
  <!-- Glowing Lock / Keyhole -->
  <circle cx="24" cy="24" r="4.5" fill="url(#goldGrad)" stroke="#713f12" stroke-width="1"/>
  <circle cx="24" cy="24" r="2" fill="#3b0764"/>
  <polygon points="23,24 25,24 26,29 22,29" fill="#3b0764"/>
  <circle cx="24" cy="24" r="1.2" fill="#c084fc"/>
</svg>
