<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="coinGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#ffcc00" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#b8860b" stop-opacity="1"/>
    </radialGradient>
  </defs>
  <!-- Outer rim -->
  <circle cx="16" cy="16" r="14" fill="#6d4c13" stroke="#ffd700" stroke-width="2"/>
  <!-- Inner body -->
  <circle cx="16" cy="16" r="11" fill="url(#coinGlow)"/>
  <!-- Emblem star/gem -->
  <polygon points="16,8 19,13 24,14 20,18 21,24 16,21 11,24 12,18 8,14 13,13" fill="#fff5cc" stroke="#b8860b" stroke-width="0.8"/>
  <!-- Sparkle highlight -->
  <circle cx="12" cy="11" r="2" fill="#ffffff" opacity="0.8"/>
</svg>
