<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <defs>
    <radialGradient id="manaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#2563eb" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="1"/>
    </radialGradient>
  </defs>
  <!-- Cork -->
  <rect x="15" y="4" width="6" height="4" rx="1" fill="#a16207" stroke="#451a03" stroke-width="0.8"/>
  <!-- Bottle Neck -->
  <rect x="14" y="8" width="8" height="5" fill="#e2e8f0" stroke="#475569" stroke-width="1" opacity="0.8"/>
  <!-- Bottle Body Glass (Diamond flask) -->
