<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="chaliceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="bloodGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </radialGradient>
  </defs>

  <!-- Dark Base Circle -->
  <circle cx="32" cy="32" r="28" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
  
  <!-- Chalice Base Foot -->
  <ellipse cx="32" cy="52" rx="14" ry="5" fill="url(#chaliceGlow)" stroke="#78350f" stroke-width="1"/>
  <!-- Stem -->
  <rect x="29" y="38" width="6" height="12" rx="1" fill="url(#chaliceGlow)" stroke="#78350f" stroke-width="0.8"/>
  <circle cx="32" cy="44" r="4.5" fill="url(#chaliceGlow)" stroke="#78350f" stroke-width="0.8"/>
  <circle cx="32" cy="44" r="2" fill="#ef4444"/>

  <!-- Chalice Cup Body -->
  <path d="M 16 18 Q 16 38 32 38 Q 48 38 48 18 Z" fill="url(#chaliceGlow)" stroke="#78350f" stroke-width="1.2"/>
  
  <!-- Holy Liquid inside Cup -->
  <ellipse cx="32" cy="18" rx="14" ry="5" fill="url(#bloodGlow)" stroke="#991b1b" stroke-width="0.8"/>
  
  <!-- Liquid Highlights & Glow -->
  <ellipse cx="30" cy="17" rx="8" ry="2.5" fill="#fca5a5" opacity="0.6"/>
  <circle cx="28" cy="17" r="1.5" fill="#ffffff"/>

  <!-- Divine Aura Rays -->
  <polygon points="32,6 33,11 36,12 33,13 32,17 31,13 28,12 31,11" fill="#fef08a"/>
  <polygon points="12,24 14,27 17,28 14,29 12,32 11,29 8,28 11,27" fill="#fef08a"/>
  <polygon points="52,24 53,27 56,28 53,29 52,32 51,29 48,28 51,27" fill="#fef08a"/>
</svg>
