<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64">
  <!-- SUMMONER — Teal/gold arcane robes, summoning circle under feet, three spectral orbs, pale wise face -->
  <!-- Colour palette: teal, deep gold, arcane white, ethereal blue -->
  <ellipse cx="32" cy="48" rx="14" ry="5" fill="#001818" opacity="0.4"/>
  <!-- Summoning circle glowing on ground -->
  <ellipse cx="32" cy="52" rx="16" ry="5" fill="none" stroke="#00d8b0" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="32" cy="52" rx="10" ry="3" fill="none" stroke="#00d8b0" stroke-width="1" opacity="0.4"/>
  <!-- Arcane runes on circle -->
  <text x="20" y="54" font-size="4" fill="#00d8b0" opacity="0.7" font-family="serif">✦</text>
  <text x="30" y="56" font-size="4" fill="#00d8b0" opacity="0.7" font-family="serif">◈</text>
  <text x="40" y="54" font-size="4" fill="#00d8b0" opacity="0.7" font-family="serif">✦</text>
  <!-- Robe -->
  <path d="M20,26 Q13,40 11,58 Q22,54 32,56 Q42,54 53,58 Q51,40 44,26 Z" fill="#0a2828"/>
  <!-- Teal robe panels -->
  <path d="M22,30 Q18,42 17,54 Q24,51 32,53 Z" fill="#0a4040" opacity="0.8"/>
  <path d="M42,30 Q46,42 47,54 Q40,51 32,53 Z" fill="#0a4040" opacity="0.8"/>
  <!-- Gold arcane trim -->
  <path d="M20,26 Q32,22 44,26" stroke="#c8a030" stroke-width="2" fill="none"/>
  <path d="M14,44 Q32,40 50,44" stroke="#c8a030" stroke-width="1.5" fill="none" opacity="0.7"/>
  <!-- Arcane rune band -->
  <rect x="22" y="30" width="20" height="3" rx="1" fill="#0a3030"/>
  <text x="24" y="33" font-size="4" fill="#00d8b0" opacity="0.8" font-family="serif">⟁ ⊕ ⟁</text>
  <!-- Body -->
  <rect x="22" y="20" width="20" height="8" rx="3" fill="#0a2828"/>
  <!-- Arms -->
  <rect x="10" y="22" width="10" height="16" rx="4" fill="#0a2828"/>
  <rect x="44" y="22" width="10" height="16" rx="4" fill="#0a2828"/>
  <!-- Gold bracers -->
  <rect x="9" y="32" width="11" height="5" rx="2" fill="#c8a030"/>
  <rect x="44" y="32" width="11" height="5" rx="2" fill="#c8a030"/>
  <!-- Summoning hands — both raised, glowing -->
  <ellipse cx="15" cy="40" rx="4" ry="4" fill="#0a2828"/>
  <ellipse cx="49" cy="40" rx="4" ry="4" fill="#0a2828"/>
  <ellipse cx="15" cy="40" rx="3" ry="3" fill="#00d8b0" opacity="0.6"/>
  <ellipse cx="49" cy="40" rx="3" ry="3" fill="#00d8b0" opacity="0.6"/>
  <!-- Three floating spectral orbs -->
  <!-- Orb 1 — left -->
  <ellipse cx="6" cy="24" rx="6" ry="6" fill="#0a3040"/>
  <ellipse cx="6" cy="24" rx="4" ry="4" fill="#00a8d0"/>
  <ellipse cx="6" cy="24" rx="2.5" ry="2.5" fill="#80e8ff"/>
  <ellipse cx="6" cy="24" rx="1" ry="1" fill="white"/>
  <ellipse cx="6" cy="24" rx="7" ry="7" fill="none" stroke="#00a8d0" stroke-width="1" opacity="0.5"/>
  <!-- Orb 2 — above centre -->
  <ellipse cx="32" cy="6" rx="6" ry="6" fill="#0a3040"/>
  <ellipse cx="32" cy="6" rx="4" ry="4" fill="#c0a030"/>
  <ellipse cx="32" cy="6" rx="2.5" ry="2.5" fill="#ffe080"/>
  <ellipse cx="32" cy="6" rx="1" ry="1" fill="white"/>
  <ellipse cx="32" cy="6" rx="7" ry="7" fill="none" stroke="#c0a030" stroke-width="1" opacity="0.5"/>
  <!-- Orb 3 — right -->
  <ellipse cx="58" cy="24" rx="6" ry="6" fill="#0a3040"/>
  <ellipse cx="58" cy="24" rx="4" ry="4" fill="#8000d0"/>
  <ellipse cx="58" cy="24" rx="2.5" ry="2.5" fill="#d080ff"/>
  <ellipse cx="58" cy="24" rx="1" ry="1" fill="white"/>
  <ellipse cx="58" cy="24" rx="7" ry="7" fill="none" stroke="#8000d0" stroke-width="1" opacity="0.5"/>
  <!-- Orb to hand lines -->
  <line x1="10" y1="26" x2="15" y2="38" stroke="#00a8d0" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>
  <line x1="32" y1="12" x2="32" y2="20" stroke="#c0a030" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>
  <line x1="54" y1="26" x2="49" y2="38" stroke="#8000d0" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>
  <!-- Tall conical hat with arcane band -->
  <path d="M32,2 L46,20 L18,20 Z" fill="#0a2828"/>
  <ellipse cx="32" cy="20" rx="14" ry="3.5" fill="#0a3838"/>
  <rect x="20" y="17" width="24" height="3" rx="1" fill="#c8a030"/>
  <!-- Face — wise, pale, long nose -->
  <ellipse cx="32" cy="22" rx="9" ry="8" fill="#d8d0e8"/>
  <!-- Eyes — pale silver, arcane -->
  <ellipse cx="28" cy="21" rx="2.5" ry="2.5" fill="#080818"/>
  <ellipse cx="36" cy="21" rx="2.5" ry="2.5" fill="#080818"/>
  <ellipse cx="28" cy="21" rx="1.8" ry="1.8" fill="#9090c0"/>
  <ellipse cx="36" cy="21" rx="1.8" ry="1.8" fill="#9090c0"/>
  <ellipse cx="28.5" cy="20.5" rx="0.8" ry="0.8" fill="#e0e0ff"/>
  <ellipse cx="36.5" cy="20.5" rx="0.8" ry="0.8" fill="#e0e0ff"/>
  <!-- Eyebrows — thin, arched high -->
  <path d="M25.5,18.5 Q28,17 30.5,18.5" stroke="#505060" stroke-width="0.9" fill="none"/>
  <path d="M33.5,18.5 Q36,17 38.5,18.5" stroke="#505060" stroke-width="0.9" fill="none"/>
  <!-- Long nose -->
  <path d="M32,22 L32,25" stroke="#b0a8c0" stroke-width="1" fill="none"/>
  <path d="M30,25 Q32,26 34,25" stroke="#b0a8c0" stroke-width="0.8" fill="none"/>
  <!-- Calm, knowing smile -->
  <path d="M29,27 Q32,29 35,27" stroke="#908890" stroke-width="0.9" fill="none"/>
</svg>
