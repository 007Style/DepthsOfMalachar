<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64">
  <!-- PALADIN — Gleaming gold/white holy armour, great hammer, holy aura, kind strong face -->
  <!-- Colour palette: polished gold, radiant white, sky blue holy light, warm tan skin -->
  <ellipse cx="32" cy="46" rx="16" ry="6" fill="#201800" opacity="0.35"/>
  <!-- Legs — gold plate -->
  <rect x="22" y="42" width="9" height="14" rx="2" fill="#c89020"/>
  <rect x="33" y="42" width="9" height="14" rx="2" fill="#c89020"/>
  <rect x="21" y="52" width="11" height="8" rx="2" fill="#a07010"/>
  <rect x="32" y="52" width="11" height="8" rx="2" fill="#a07010"/>
  <!-- Holy light aura at feet -->
  <ellipse cx="32" cy="56" rx="14" ry="4" fill="none" stroke="#fff0a0" stroke-width="1.5" opacity="0.5"/>
  <!-- Body — radiant gold plate -->
  <rect x="18" y="22" width="28" height="22" rx="4" fill="#d4a020"/>
  <!-- Chest holy symbol (sun cross) -->
  <rect x="29" y="24" width="6" height="16" rx="1" fill="#fff8d0"/>
  <rect x="21" y="30" width="22" height="6" rx="1" fill="#fff8d0"/>
  <ellipse cx="32" cy="32" rx="5" ry="5" fill="#f0c040"/>
  <ellipse cx="32" cy="32" rx="3" ry="3" fill="#fffaf0"/>
  <!-- Gold trim -->
  <rect x="18" y="22" width="28" height="2" rx="1" fill="#f0d060"/>
  <rect x="18" y="42" width="28" height="2" rx="1" fill="#f0d060"/>
  <!-- Pauldrons — large, ornate -->
  <ellipse cx="13" cy="26" rx="9" ry="7" fill="#e0b030"/>
  <ellipse cx="51" cy="26" rx="9" ry="7" fill="#e0b030"/>
  <ellipse cx="13" cy="26" rx="6" ry="5" fill="#f0d060"/>
  <ellipse cx="51" cy="26" rx="6" ry="5" fill="#f0d060"/>
  <!-- Arms -->
  <rect x="5" y="26" width="9" height="16" rx="3" fill="#d4a020"/>
  <rect x="50" y="26" width="9" height="16" rx="3" fill="#d4a020"/>
  <!-- Gauntlets -->
  <rect x="4" y="38" width="10" height="7" rx="2" fill="#a07010"/>
  <rect x="50" y="38" width="10" height="7" rx="2" fill="#a07010"/>
  <!-- Great Hammer (right arm, raised) -->
  <rect x="52" y="30" width="4" height="30" rx="2" fill="#b08030" transform="rotate(-20,54,45)"/>
  <rect x="47" y="20" width="16" height="12" rx="3" fill="#e0b030" transform="rotate(-20,54,45)"/>
  <rect x="48" y="22" width="14" height="8" rx="2" fill="#f0d060" transform="rotate(-20,54,45)"/>
  <!-- Hammer holy glow -->
  <ellipse cx="55" cy="24" rx="10" ry="8" fill="none" stroke="#fff0a0" stroke-width="1.5" opacity="0.6" transform="rotate(-20,54,45)"/>
  <!-- Shield (left arm) -->
  <path d="M4,26 Q2,36 6,46 Q10,50 14,46 Q18,36 16,26 Q12,22 4,26 Z" fill="#c89020"/>
  <path d="M6,28 Q4,36 7,44 Q10,48 13,44 Q16,36 14,28 Q11,25 6,28 Z" fill="#e0b030"/>
  <ellipse cx="10" cy="36" rx="4" ry="5" fill="#fffaf0"/>
  <ellipse cx="10" cy="36" rx="2.5" ry="3" fill="#f0c040"/>
  <!-- Helmet — open face, gold with white plume -->
  <rect x="20" y="10" width="24" height="16" rx="6" fill="#d4a020"/>
  <rect x="22" y="12" width="20" height="12" rx="4" fill="#e0b030"/>
  <!-- Plume -->
  <rect x="30" y="4" width="4" height="10" rx="2" fill="#e0e8ff"/>
  <ellipse cx="32" cy="5" rx="3" ry="4" fill="white"/>
  <!-- Face — strong jaw, warm expression -->
  <ellipse cx="32" cy="21" rx="9" ry="8" fill="#d4a878"/>
  <!-- Eyes — warm blue, kind -->
  <ellipse cx="28" cy="20" rx="2.5" ry="2.5" fill="#102050"/>
  <ellipse cx="36" cy="20" rx="2.5" ry="2.5" fill="#102050"/>
  <ellipse cx="28" cy="20" rx="1.8" ry="1.8" fill="#3060d0"/>
  <ellipse cx="36" cy="20" rx="1.8" ry="1.8" fill="#3060d0"/>
  <ellipse cx="28.5" cy="19.5" rx="0.8" ry="0.8" fill="#a0c0ff"/>
  <ellipse cx="36.5" cy="19.5" rx="0.8" ry="0.8" fill="#a0c0ff"/>
  <!-- Strong brows -->
  <path d="M25.5,17.5 Q28,16.5 30.5,17.5" stroke="#7a6040" stroke-width="1.5" fill="none"/>
  <path d="M33.5,17.5 Q36,16.5 38.5,17.5" stroke="#7a6040" stroke-width="1.5" fill="none"/>
  <!-- Nose — broad -->
  <ellipse cx="32" cy="22" rx="1.2" ry="1" fill="#b88860"/>
  <!-- Warm determined smile -->
  <path d="M28.5,24 Q32,26 35.5,24" stroke="#9a7050" stroke-width="1.2" fill="none"/>
  <!-- Chin stubble -->
  <path d="M28,25 Q32,27 36,25" stroke="#9a7050" stroke-width="0.8" fill="none" opacity="0.4"/>
</svg>
