<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64">
  <!-- DRUID — Bark-brown nature robes, vine staff, flower crown, green eyes, earthy -->
  <!-- Colour palette: bark brown, moss green, leaf gold, living vine -->
  <ellipse cx="32" cy="48" rx="14" ry="5" fill="#081408" opacity="0.4"/>
  <path d="M20,26 Q13,40 11,58 Q22,54 32,56 Q42,54 53,58 Q51,40 44,26 Z" fill="#3a2810"/>
  <!-- Nature pattern on robe -->
  <path d="M18,38 Q22,34 26,38 Q22,42 18,38 Z" fill="#285a18" opacity="0.8"/>
  <path d="M38,40 Q42,36 46,40 Q42,44 38,40 Z" fill="#285a18" opacity="0.8"/>
  <path d="M26,50 Q30,46 34,50 Q30,54 26,50 Z" fill="#285a18" opacity="0.7"/>
  <!-- Body -->
  <rect x="22" y="22" width="20" height="10" rx="3" fill="#3a2810"/>
  <!-- Vine belt -->
  <path d="M20,32 Q26,28 32,32 Q38,28 44,32" stroke="#285a18" stroke-width="3" fill="none"/>
  <!-- Arms — wrapped in vine/bark -->
  <rect x="10" y="24" width="10" height="14" rx="4" fill="#3a2810"/>
  <rect x="44" y="24" width="10" height="14" rx="4" fill="#3a2810"/>
  <!-- Vine wrapping arms -->
  <path d="M10,26 Q15,24 20,28 Q15,30 10,28" stroke="#285a18" stroke-width="1.5" fill="none"/>
  <path d="M44,26 Q49,24 54,28 Q49,30 44,28" stroke="#285a18" stroke-width="1.5" fill="none"/>
  <!-- Hands -->
  <ellipse cx="15" cy="40" rx="4" ry="3" fill="#4a3820"/>
  <ellipse cx="49" cy="40" rx="4" ry="3" fill="#4a3820"/>
  <!-- Vine staff (left hand) -->
  <path d="M8,4 Q6,20 8,36 Q10,44 9,56" stroke="#3a5010" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M8,4 Q4,10 6,16" stroke="#285a18" stroke-width="2" fill="none"/>
  <path d="M8,12 Q12,8 14,12" stroke="#285a18" stroke-width="2" fill="none"/>
  <!-- Flowers blooming on staff -->
  <circle cx="7" cy="6" r="3" fill="#e04060"/>
  <circle cx="7" cy="6" r="1.5" fill="#ffd0e0"/>
  <circle cx="13" cy="10" r="2.5" fill="#f0c040"/>
  <circle cx="13" cy="10" r="1.2" fill="#fffad0"/>
  <!-- Life energy from hand -->
  <circle cx="50" cy="38" r="2.5" fill="#40d060" opacity="0.6"/>
  <circle cx="53" cy="35" r="1.5" fill="#60ff80" opacity="0.5"/>
  <circle cx="47" cy="36" r="1.5" fill="#40d060" opacity="0.5"/>
  <!-- Flower crown / antler-like head gear -->
  <path d="M22,14 Q18,8 20,4 Q24,6 26,10" stroke="#3a5010" stroke-width="2.5" fill="none"/>
  <path d="M42,14 Q46,8 44,4 Q40,6 38,10" stroke="#3a5010" stroke-width="2.5" fill="none"/>
  <circle cx="20" cy="4" r="3" fill="#e04060"/>
  <circle cx="44" cy="4" r="3" fill="#f0c040"/>
  <circle cx="26" cy="8" r="2" fill="#e080a0"/>
  <circle cx="38" cy="8" r="2" fill="#f0d060"/>
  <!-- Face — warm, gentle, with vine-mark on cheek -->
  <ellipse cx="32" cy="18" rx="9" ry="9" fill="#c8a870"/>
  <!-- Vine tattoo on left cheek -->
  <path d="M24,18 Q22,16 23,14 Q25,15 24,18" stroke="#285a18" stroke-width="1" fill="none"/>
  <!-- Eyes — bright green, warm -->
  <ellipse cx="28" cy="17" rx="2.5" ry="2.5" fill="#081808"/>
  <ellipse cx="36" cy="17" rx="2.5" ry="2.5" fill="#081808"/>
  <ellipse cx="28" cy="17" rx="1.8" ry="1.8" fill="#20a030"/>
  <ellipse cx="36" cy="17" rx="1.8" ry="1.8" fill="#20a030"/>
  <ellipse cx="28.5" cy="16.5" rx="0.8" ry="0.8" fill="#80ff90"/>
  <ellipse cx="36.5" cy="16.5" rx="0.8" ry="0.8" fill="#80ff90"/>
  <!-- Brows — gentle arch -->
  <path d="M25.5,14.5 Q28,13.5 30.5,14.5" stroke="#604030" stroke-width="1" fill="none"/>
  <path d="M33.5,14.5 Q36,13.5 38.5,14.5" stroke="#604030" stroke-width="1" fill="none"/>
  <!-- Nose + serene smile -->
  <ellipse cx="32" cy="19" rx="1" ry="0.8" fill="#a87848"/>
  <path d="M29,21.5 Q32,23.5 35,21.5" stroke="#907050" stroke-width="1" fill="none"/>
</svg>
