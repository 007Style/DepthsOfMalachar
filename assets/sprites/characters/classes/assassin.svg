<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64">
  <!-- ASSASSIN — Jet black bodysuit, silver mask, shadow cloak, twin blades, cold blue eyes -->
  <!-- Colour palette: pure black, cold silver, icy blue, sharp edges -->
  <ellipse cx="32" cy="47" rx="12" ry="4" fill="#000005" opacity="0.5"/>
  <!-- Ultra lean legs -->
  <rect x="25" y="42" width="7" height="14" rx="3" fill="#080810"/>
  <rect x="32" y="42" width="7" height="14" rx="3" fill="#080810"/>
  <rect x="24" y="52" width="9" height="8" rx="2" fill="#050508"/>
  <rect x="31" y="52" width="9" height="8" rx="2" fill="#050508"/>
  <!-- Shadow wreathe at feet -->
  <path d="M20,56 Q32,60 44,56 Q40,58 32,59 Q24,58 20,56 Z" fill="#1010a0" opacity="0.3"/>
  <!-- Body — skin-tight bodysuit -->
  <rect x="23" y="22" width="18" height="22" rx="4" fill="#0a0a14"/>
  <!-- Suit seam/edge details -->
  <line x1="32" y1="22" x2="32" y2="44" stroke="#1a1a28" stroke-width="1"/>
  <rect x="25" y="28" width="14" height="1" rx="0.5" fill="#1a1a28"/>
  <rect x="25" y="34" width="14" height="1" rx="0.5" fill="#1a1a28"/>
  <!-- Cold silver utility pouches -->
  <rect x="23" y="33" width="5" height="5" rx="1" fill="#404050"/>
  <rect x="36" y="33" width="5" height="5" rx="1" fill="#404050"/>
  <!-- Arms — sleek -->
  <rect x="14" y="24" width="8" height="16" rx="3" fill="#0a0a14"/>
  <rect x="42" y="24" width="8" height="16" rx="3" fill="#0a0a14"/>
  <!-- Blade sheathes on forearms -->
  <rect x="14" y="28" width="8" height="3" rx="1" fill="#303040"/>
  <rect x="42" y="28" width="8" height="3" rx="1" fill="#303040"/>
  <!-- Hands -->
  <ellipse cx="18" cy="42" rx="4" ry="3" fill="#0a0a14"/>
  <ellipse cx="46" cy="42" rx="4" ry="3" fill="#0a0a14"/>
  <!-- Twin long blades flicked out -->
  <rect x="13" y="26" width="1.5" height="20" rx="0.8" fill="#d0d8e8" transform="rotate(-20,14,36)"/>
  <line x1="11" y1="26" x2="14" y2="46" stroke="#a0b0c0" stroke-width="0.5" transform="rotate(-20,14,36)"/>
  <rect x="49" y="26" width="1.5" height="20" rx="0.8" fill="#d0d8e8" transform="rotate(20,50,36)"/>
  <line x1="51" y1="26" x2="48" y2="46" stroke="#a0b0c0" stroke-width="0.5" transform="rotate(20,50,36)"/>
  <!-- Blade tips glow cold blue -->
  <ellipse cx="12" cy="45" rx="2" ry="1" fill="#2060ff" opacity="0.7" transform="rotate(-20,14,36)"/>
  <ellipse cx="52" cy="45" rx="2" ry="1" fill="#2060ff" opacity="0.7" transform="rotate(20,50,36)"/>
  <!-- Shadow cloak — billowing, nearly invisible -->
  <path d="M18,22 Q10,36 12,54 Q18,48 24,52 Q24,38 24,22 Z" fill="#050510" opacity="0.9"/>
  <path d="M46,22 Q54,36 52,54 Q46,48 40,52 Q40,38 40,22 Z" fill="#050510" opacity="0.9"/>
  <!-- Shadow wisp at cloak edge -->
  <path d="M12,54 Q10,56 11,60" stroke="#1010a0" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M52,54 Q54,56 53,60" stroke="#1010a0" stroke-width="1.5" fill="none" opacity="0.5"/>
  <!-- Mask — silver, expressionless -->
  <ellipse cx="32" cy="19" rx="10" ry="10" fill="#0a0a14"/>
  <rect x="22" y="14" width="20" height="12" rx="5" fill="#282838"/>
  <!-- Mask ridges -->
  <path d="M22,18 Q32,16 42,18" stroke="#404050" stroke-width="0.8" fill="none"/>
  <path d="M22,21 Q32,19 42,21" stroke="#404050" stroke-width="0.8" fill="none"/>
  <!-- Eyes — cold icy blue, narrow slits in mask -->
  <rect x="25" y="17" width="6" height="3" rx="1.5" fill="#080810"/>
  <rect x="33" y="17" width="6" height="3" rx="1.5" fill="#080810"/>
  <ellipse cx="28" cy="18.5" rx="2.2" ry="1.2" fill="#0060d0"/>
  <ellipse cx="36" cy="18.5" rx="2.2" ry="1.2" fill="#0060d0"/>
  <ellipse cx="28" cy="18.5" rx="1.2" ry="0.8" fill="#40b0ff"/>
  <ellipse cx="36" cy="18.5" rx="1.2" ry="0.8" fill="#40b0ff"/>
  <!-- No mouth on mask -->
  <!-- Hair — a single lock escaping the mask -->
  <path d="M22,14 Q20,10 22,8 Q24,10 23,14" fill="#303030"/>
</svg>
