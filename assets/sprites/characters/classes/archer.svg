<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64">
  <!-- ARCHER — Forest green ranger, longbow, quiver, hawk feather, sharp eyes -->
  <!-- Colour palette: forest green, earthy brown, cream, sharp hazel eyes -->
  <ellipse cx="32" cy="47" rx="13" ry="5" fill="#081008" opacity="0.4"/>
  <rect x="23" y="42" width="8" height="14" rx="3" fill="#2a4020"/>
  <rect x="33" y="42" width="8" height="14" rx="3" fill="#2a4020"/>
  <rect x="22" y="52" width="10" height="8" rx="2" fill="#1a2810"/>
  <rect x="32" y="52" width="10" height="8" rx="2" fill="#1a2810"/>
  <!-- Body — forest ranger tunic -->
  <rect x="21" y="22" width="22" height="22" rx="4" fill="#2e4a22"/>
  <!-- Leather vest over tunic -->
  <rect x="23" y="22" width="18" height="16" rx="3" fill="#4a3018"/>
  <!-- Stitching details -->
  <line x1="32" y1="22" x2="32" y2="38" stroke="#603820" stroke-width="0.8" stroke-dasharray="2,2"/>
  <!-- Belt + quiver strap -->
  <rect x="21" y="36" width="22" height="2.5" rx="1" fill="#3a2810"/>
  <rect x="30" y="22" width="2" height="20" rx="1" fill="#3a2810" transform="rotate(15,31,32)"/>
  <!-- Quiver on back (right side) -->
  <rect x="44" y="14" width="7" height="20" rx="3" fill="#4a3018"/>
  <rect x="45" y="16" width="5" height="16" rx="2" fill="#6a4828"/>
  <!-- Arrows in quiver -->
  <line x1="46" y1="15" x2="46" y2="10" stroke="#c8a840" stroke-width="1.5"/>
  <line x1="48" y1="15" x2="48.5" y2="9" stroke="#c8a840" stroke-width="1.5"/>
  <line x1="50" y1="15" x2="50.5" y2="10" stroke="#c8a840" stroke-width="1.5"/>
  <!-- Arrow fletching -->
  <path d="M45,10 L43,8 L46,10" fill="#2e4a22"/>
  <path d="M47.5,9 L45.5,7 L48.5,9" fill="#2e4a22"/>
  <path d="M50,10 L48,8 L51,10" fill="#2e4a22"/>
  <!-- Arms -->
  <rect x="12" y="24" width="8" height="14" rx="3" fill="#2e4a22"/>
  <rect x="44" y="24" width="8" height="14" rx="3" fill="#2e4a22"/>
  <!-- Bracers -->
  <rect x="11" y="32" width="9" height="7" rx="2" fill="#4a3018"/>
  <rect x="44" y="32" width="9" height="7" rx="2" fill="#4a3018"/>
  <!-- Longbow (left arm, drawn) -->
  <path d="M8,4 Q2,32 8,60" stroke="#7a5020" stroke-width="3" fill="none"/>
  <line x1="8" y1="4" x2="8" y2="60" stroke="#c8a050" stroke-width="0.8" stroke-dasharray="4,3"/>
  <!-- Hooded cap with hawk feather -->
  <path d="M20,16 Q20,6 32,4 Q44,6 44,16 Q42,12 32,10 Q22,12 20,16 Z" fill="#2e4a22"/>
  <path d="M20,18 Q22,10 32,8 Q42,10 44,18 L42,20 Q36,14 32,14 Q28,14 22,20 Z" fill="#3a5a2a"/>
  <!-- Hawk feather in cap -->
  <path d="M38,8 Q42,4 44,2 Q46,6 42,10" fill="#c8b060" opacity="0.9"/>
  <line x1="41" y1="6" x2="43" y2="2" stroke="#a09040" stroke-width="0.8"/>
  <!-- Face — tanned, sharp-eyed ranger -->
  <ellipse cx="32" cy="20" rx="9" ry="8" fill="#b89060"/>
  <!-- Eyes — hazel, sharp, narrowed -->
  <ellipse cx="28" cy="19" rx="2.5" ry="2" fill="#201008"/>
  <ellipse cx="36" cy="19" rx="2.5" ry="2" fill="#201008"/>
  <ellipse cx="28" cy="19" rx="1.8" ry="1.4" fill="#806020"/>
  <ellipse cx="36" cy="19" rx="1.8" ry="1.4" fill="#806020"/>
  <ellipse cx="28.5" cy="18.6" rx="0.7" ry="0.7" fill="#c09030"/>
  <ellipse cx="36.5" cy="18.6" rx="0.7" ry="0.7" fill="#c09030"/>
  <!-- Eyebrows — sharp, focused -->
  <path d="M25.5,16.5 Q28,15.5 30.5,16.8" stroke="#604030" stroke-width="1.3" fill="none"/>
  <path d="M33.5,16.8 Q36,15.5 38.5,16.5" stroke="#604030" stroke-width="1.3" fill="none"/>
  <!-- Nose — straight, angular -->
  <line x1="32" y1="20" x2="32" y2="22" stroke="#907050" stroke-width="0.8"/>
  <path d="M30.5,22 Q32,22.8 33.5,22" stroke="#907050" stroke-width="0.8" fill="none"/>
  <!-- Focused expression, slight squint -->
  <path d="M29,24 Q32,25 35,24" stroke="#705030" stroke-width="0.8" fill="none"/>
  <!-- Faint scar on right cheek (battle-worn) -->
  <line x1="37" y1="20" x2="38.5" y2="23" stroke="#a07040" stroke-width="0.7" opacity="0.6"/>
</svg>
