<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64">
  <!-- WARRIOR — Heavy red/iron armour, full helmet with visor, broad sword, shield -->
  <!-- Colour palette: deep crimson, iron grey, gold trim -->
  <ellipse cx="32" cy="46" rx="16" ry="6" fill="#200000" opacity="0.45"/>
  <!-- Legs — heavy plate -->
  <rect x="22" y="42" width="9" height="14" rx="2" fill="#703030"/>
  <rect x="33" y="42" width="9" height="14" rx="2" fill="#703030"/>
  <rect x="21" y="52" width="11" height="8" rx="2" fill="#502020"/>
  <rect x="32" y="52" width="11" height="8" rx="2" fill="#502020"/>
  <!-- Body — broad plate torso, red enamel -->
  <rect x="18" y="22" width="28" height="24" rx="4" fill="#8b1a1a"/>
  <!-- Chest plate highlight -->
  <rect x="21" y="24" width="10" height="12" rx="2" fill="#a03030"/>
  <rect x="33" y="24" width="10" height="12" rx="2" fill="#a03030"/>
  <!-- Gold trim lines -->
  <rect x="18" y="34" width="28" height="2" fill="#c8a030"/>
  <!-- Pauldrons — wide iron -->
  <ellipse cx="14" cy="26" rx="8" ry="6" fill="#606070"/>
  <ellipse cx="50" cy="26" rx="8" ry="6" fill="#606070"/>
  <!-- Shield (left arm) -->
  <rect x="4" y="24" width="14" height="20" rx="3" fill="#7a1a1a"/>
  <rect x="6" y="26" width="10" height="16" rx="2" fill="#a02020"/>
  <ellipse cx="11" cy="34" rx="4" ry="4" fill="#c8a030"/>
  <!-- Sword (right arm, raised) -->
  <rect x="46" y="10" width="4" height="30" rx="1.5" fill="#c0c8d0" transform="rotate(15,48,25)"/>
  <rect x="42" y="20" width="12" height="3" rx="1" fill="#c8a030" transform="rotate(15,48,25)"/>
  <!-- Arms -->
  <rect x="6" y="26" width="8" height="14" rx="3" fill="#606070"/>
  <rect x="50" y="26" width="8" height="14" rx="3" fill="#606070"/>
  <!-- Helmet — full visor, iron with red plume -->
  <ellipse cx="32" cy="18" rx="12" ry="13" fill="#505060"/>
  <!-- Visor slit — glowing red eyes -->
  <rect x="22" y="16" width="20" height="5" rx="2" fill="#201010"/>
  <ellipse cx="27" cy="18" rx="3" ry="2" fill="#ff2020"/>
  <ellipse cx="37" cy="18" rx="3" ry="2" fill="#ff2020"/>
  <ellipse cx="27" cy="18" rx="2" ry="1.2" fill="#ff6060"/>
  <ellipse cx="37" cy="18" rx="2" ry="1.2" fill="#ff6060"/>
  <!-- Helmet crest/plume -->
  <rect x="30" y="4" width="4" height="10" rx="2" fill="#c01010"/>
  <ellipse cx="32" cy="5" rx="3" ry="4" fill="#e02020"/>
  <!-- Helmet gold trim -->
  <path d="M20,12 Q32,8 44,12" stroke="#c8a030" stroke-width="1.5" fill="none"/>
  <rect x="20" y="22" width="24" height="2" rx="1" fill="#c8a030"/>
</svg>
