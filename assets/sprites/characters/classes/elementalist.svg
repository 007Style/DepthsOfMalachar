<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64">
  <!-- ELEMENTALIST — Swirling dual-element robes, one hand fire one hand ice, split colour design -->
  <!-- Colour palette: left half deep orange/fire, right half ice blue, white hair, split eyes -->
  <ellipse cx="32" cy="48" rx="14" ry="5" fill="#100808" opacity="0.4"/>
  <!-- Robe — split fire/ice design -->
  <path d="M20,26 Q14,40 12,58 Q22,54 32,56 Z" fill="#7a2000"/>
  <path d="M44,26 Q50,40 52,58 Q42,54 32,56 Z" fill="#003060"/>
  <!-- Fire side robe highlight -->
  <path d="M22,30 Q18,42 17,54 Q22,50 28,52 Q28,40 26,30 Z" fill="#c04010" opacity="0.7"/>
  <!-- Ice side robe highlight -->
  <path d="M42,30 Q46,42 47,54 Q42,50 36,52 Q36,40 38,30 Z" fill="#0060a0" opacity="0.7"/>
  <!-- Fire/ice dividing line down centre of body -->
  <line x1="32" y1="22" x2="32" y2="58" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
  <!-- Body -->
  <rect x="22" y="20" width="20" height="8" rx="3" fill="#3a1800"/>
  <rect x="32" y="20" width="10" height="8" rx="3" fill="#001830"/>
  <!-- Energy spiral collar -->
  <path d="M22,22 Q27,18 32,22" stroke="#ff6020" stroke-width="2" fill="none"/>
  <path d="M32,22 Q37,18 42,22" stroke="#40a0ff" stroke-width="2" fill="none"/>
  <!-- Arms -->
  <rect x="10" y="22" width="10" height="16" rx="4" fill="#7a2000"/>
  <rect x="44" y="22" width="10" height="16" rx="4" fill="#003060"/>
  <!-- Fire hand (left) -->
  <ellipse cx="15" cy="40" rx="5" ry="4" fill="#c04010"/>
  <ellipse cx="15" cy="40" rx="3" ry="3" fill="#ff8020"/>
  <ellipse cx="15" cy="40" rx="1.5" ry="1.5" fill="#ffdf80"/>
  <!-- Fire particles -->
  <path d="M12,38 Q10,34 12,30" stroke="#ff4000" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M14,36 Q11,32 13,28" stroke="#ff8020" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M17,37 Q15,33 17,29" stroke="#ffc040" stroke-width="1.5" fill="none" opacity="0.6"/>
  <!-- Ice hand (right) -->
  <ellipse cx="49" cy="40" rx="5" ry="4" fill="#0060a0"/>
  <ellipse cx="49" cy="40" rx="3" ry="3" fill="#40b0ff"/>
  <ellipse cx="49" cy="40" rx="1.5" ry="1.5" fill="#c0e8ff"/>
  <!-- Ice crystals -->
  <path d="M49,38 L49,30" stroke="#c0e8ff" stroke-width="1.5" fill="none"/>
  <path d="M47,36 L51,32" stroke="#c0e8ff" stroke-width="1" fill="none"/>
  <path d="M51,36 L47,32" stroke="#c0e8ff" stroke-width="1" fill="none"/>
  <!-- Hair — stark white, swept -->
  <path d="M22,14 Q20,6 26,4 Q32,2 38,4 Q44,6 42,14" fill="#e8eef8"/>
  <path d="M22,14 Q18,8 20,4" fill="#e8eef8"/>
  <path d="M42,14 Q46,8 44,4" fill="#e8eef8"/>
  <!-- Face — angular, intense, split colour mark -->
  <ellipse cx="32" cy="18" rx="9" ry="9" fill="#d8c8b8"/>
  <!-- Split face marking (left fire, right ice) -->
  <path d="M32,10 Q31,14 32,18 Q31,22 32,26" stroke="#ff6020" stroke-width="1" fill="none" opacity="0.5"/>
  <!-- Left eye — fire orange -->
  <ellipse cx="28" cy="17" rx="2.5" ry="2.5" fill="#200800"/>
  <ellipse cx="28" cy="17" rx="1.8" ry="1.8" fill="#e04000"/>
  <ellipse cx="28.5" cy="16.5" rx="0.8" ry="0.8" fill="#ffb040"/>
  <!-- Right eye — ice blue -->
  <ellipse cx="36" cy="17" rx="2.5" ry="2.5" fill="#000820"/>
  <ellipse cx="36" cy="17" rx="1.8" ry="1.8" fill="#0080e0"/>
  <ellipse cx="36.5" cy="16.5" rx="0.8" ry="0.8" fill="#c0f0ff"/>
  <!-- Eye glow halos (split) -->
  <ellipse cx="28" cy="17" rx="3.5" ry="3.5" fill="none" stroke="#ff4000" stroke-width="0.8" opacity="0.6"/>
  <ellipse cx="36" cy="17" rx="3.5" ry="3.5" fill="none" stroke="#0090ff" stroke-width="0.8" opacity="0.6"/>
  <!-- Eyebrows — sharp upward arch -->
  <path d="M25,14.5 Q28,13 30.5,14.5" stroke="#605040" stroke-width="1.2" fill="none"/>
  <path d="M33.5,14.5 Q36,13 39,14.5" stroke="#605040" stroke-width="1.2" fill="none"/>
  <!-- Nose -->
  <ellipse cx="32" cy="20" rx="1" ry="0.8" fill="#b0988a"/>
  <!-- Mouth — focused, slightly parted -->
  <path d="M29,22.5 Q32,23.5 35,22.5" stroke="#907060" stroke-width="0.9" fill="none"/>
  <!-- Arcane rune on forehead (split) -->
  <text x="29" y="13" font-size="6" fill="#ff6020" opacity="0.8" font-family="serif">⁂</text>
</svg>
