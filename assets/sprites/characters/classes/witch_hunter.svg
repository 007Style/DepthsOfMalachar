<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64">
  <!-- WITCH HUNTER — Dark grey longcoat, wide-brimmed hat, holy crossbow, demon-brand scars, stern face -->
  <!-- Colour palette: slate grey, holy silver, copper holy symbols, dark skin, amber stern eyes -->
  <ellipse cx="32" cy="47" rx="14" ry="5" fill="#080808" opacity="0.4"/>
  <!-- Legs — longcoat covers, grey trousers -->
  <rect x="23" y="42" width="9" height="14" rx="3" fill="#3a3840"/>
  <rect x="32" y="42" width="9" height="14" rx="3" fill="#3a3840"/>
  <rect x="22" y="52" width="11" height="8" rx="2" fill="#282830"/>
  <rect x="31" y="52" width="11" height="8" rx="2" fill="#282830"/>
  <!-- Long coat body -->
  <rect x="18" y="22" width="28" height="24" rx="4" fill="#484850"/>
  <!-- Coat lapels -->
  <path d="M26,22 Q32,26 38,22 L36,30 Q32,28 28,30 Z" fill="#3a3840"/>
  <!-- Coat buttons -->
  <circle cx="32" cy="30" r="1.5" fill="#c8a030"/>
  <circle cx="32" cy="34" r="1.5" fill="#c8a030"/>
  <circle cx="32" cy="38" r="1.5" fill="#c8a030"/>
  <!-- Holy symbol on chest (silver cross with sun rays) -->
  <rect x="29" y="23" width="3" height="8" rx="1" fill="#d0c8a8"/>
  <rect x="27" y="26" width="7" height="3" rx="1" fill="#d0c8a8"/>
  <ellipse cx="31" cy="27" rx="2.5" ry="2.5" fill="#f0e8a0" opacity="0.6"/>
  <!-- Coat tails -->
  <path d="M18,44 Q14,52 16,58 Q20,54 24,56 Q22,50 22,44" fill="#484850"/>
  <path d="M46,44 Q50,52 48,58 Q44,54 40,56 Q42,50 42,44" fill="#484850"/>
  <!-- Pauldrons — silver -->
  <ellipse cx="15" cy="26" rx="7" ry="5" fill="#909098"/>
  <ellipse cx="49" cy="26" rx="7" ry="5" fill="#909098"/>
  <!-- Arms -->
  <rect x="8" y="26" width="9" height="16" rx="3" fill="#484850"/>
  <rect x="47" y="26" width="9" height="16" rx="3" fill="#484850"/>
  <!-- Holy crossbow (right arm, aimed) -->
  <!-- Bow body -->
  <rect x="48" y="28" width="14" height="4" rx="2" fill="#6a4820"/>
  <!-- Stock -->
  <rect x="56" y="24" width="4" height="12" rx="2" fill="#5a3810"/>
  <!-- Silver string -->
  <line x1="48" y1="29" x2="48" y2="32" stroke="#d0c8a8" stroke-width="1.5"/>
  <path d="M48,29 Q36,30.5 48,32" stroke="#d0c8a8" stroke-width="1" fill="none"/>
  <!-- Holy bolt loaded -->
  <rect x="52" y="29.5" width="8" height="2" rx="1" fill="#f0e8a0"/>
  <ellipse cx="59" cy="30.5" rx="1.5" ry="1.5" fill="#f0e8a0"/>
  <!-- Left hand — grappling hook/chain -->
  <ellipse cx="13" cy="44" rx="4" ry="3" fill="#806030"/>
  <path d="M13,44 Q8,40 6,36" stroke="#c0a040" stroke-width="2" fill="none"/>
  <path d="M6,36 L4,33 L8,34 L6,36 Z" fill="#c0a040"/>
  <!-- Wide-brimmed hunter's hat -->
  <ellipse cx="32" cy="13" rx="18" ry="5" fill="#282830"/>
  <ellipse cx="32" cy="13" rx="16" ry="4" fill="#3a3840"/>
  <rect x="22" y="8" width="20" height="8" rx="3" fill="#282830"/>
  <!-- Silver hat band -->
  <rect x="22" y="12" width="20" height="2" rx="1" fill="#909098"/>
  <!-- Holy symbol on hat -->
  <rect x="30.5" y="9" width="2" height="6" rx="0.5" fill="#d0c8a8"/>
  <rect x="28.5" y="11" width="6" height="2" rx="0.5" fill="#d0c8a8"/>
  <!-- Face — dark skin, deep set eyes, stern, battle-worn -->
  <ellipse cx="32" cy="19" rx="9" ry="8" fill="#704820"/>
  <!-- Demon-brand scar on left cheek (V-shaped burn mark) -->
  <path d="M24,18 Q25,20 27,21 Q25,22 24,24" stroke="#a06030" stroke-width="1.5" fill="none" opacity="0.8"/>
  <!-- Eyes — deep amber, narrowed, no-nonsense -->
  <ellipse cx="28" cy="18" rx="2.5" ry="2" fill="#201000"/>
  <ellipse cx="36" cy="18" rx="2.5" ry="2" fill="#201000"/>
  <ellipse cx="28" cy="18" rx="1.8" ry="1.4" fill="#c07010"/>
  <ellipse cx="36" cy="18" rx="1.8" ry="1.4" fill="#c07010"/>
  <ellipse cx="28.5" cy="17.6" rx="0.7" ry="0.7" fill="#e0a030"/>
  <ellipse cx="36.5" cy="17.6" rx="0.7" ry="0.7" fill="#e0a030"/>
  <!-- Heavy furrowed brows -->
  <rect x="25" y="15" width="7" height="2" rx="1" fill="#3a2010" transform="rotate(-5,28,16)"/>
  <rect x="32" y="15" width="7" height="2" rx="1" fill="#3a2010" transform="rotate(5,36,16)"/>
  <!-- Nose — strong, broad -->
  <path d="M30,20 Q32,21.5 34,20" stroke="#6a3810" stroke-width="1.2" fill="none"/>
  <path d="M31,20 L31,22" stroke="#6a3810" stroke-width="1" fill="none"/>
  <path d="M33,20 L33,22" stroke="#6a3810" stroke-width="1" fill="none"/>
  <!-- Grim, tight-lipped expression -->
  <path d="M28.5,23.5 Q32,24 35.5,23.5" stroke="#5a3010" stroke-width="1.2" fill="none"/>
  <!-- Short beard -->
  <path d="M27,24 Q32,26.5 37,24" stroke="#4a2808" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M28,25 Q32,27 36,25" stroke="#4a2808" stroke-width="1" fill="none" opacity="0.5"/>
</svg>
