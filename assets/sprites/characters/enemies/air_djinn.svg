<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Swirling air body — cyclone form -->
  <ellipse cx="32" cy="36" rx="18" ry="22" fill="#aabbcc" opacity="0.4"/>
