  <ellipse cx="32" cy="36" rx="18" ry="22" fill="none" stroke="#8899bb" stroke-width="2" opacity="0.5"/>
  <ellipse cx="32" cy="38" rx="14" ry="16" fill="none" stroke="#99aacc" stroke-width="2" opacity="0.5"/>
  <ellipse cx="32" cy="40" rx="10" ry="11" fill="none" stroke="#aabbdd" stroke-width="2" opacity="0.5"/>
  <ellipse cx="32" cy="42" rx="6" ry="6" fill="none" stroke="#bbccee" stroke-width="2" opacity="0.5"/>
  <!-- Solid core body suggestion -->
  <ellipse cx="32" cy="36" rx="10" ry="12" fill="#ccddee" opacity="0.6"/>
  <!-- Wind spiral arms -->
  <path d="M14 28 Q8 20 12 14 Q18 22 18 30" fill="none" stroke="#99bbdd" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
  <path d="M50 28 Q56 20 52 14 Q46 22 46 30" fill="none" stroke="#99bbdd" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
  <!-- Head — wispy elemental face -->
  <ellipse cx="32" cy="22" rx="12" ry="10" fill="#ddeeff" opacity="0.7"/>
  <!-- Eyes — stormy silver-blue -->
  <ellipse cx="26" cy="21" rx="4" ry="3.5" fill="#334455"/>
  <ellipse cx="38" cy="21" rx="4" ry="3.5" fill="#334455"/>
  <circle cx="26" cy="21" r="2" fill="#aaccee" opacity="0.95"/>
  <circle cx="38" cy="21" r="2" fill="#aaccee" opacity="0.95"/>
  <circle cx="26" cy="21" r="0.8" fill="#eeffff"/>
  <circle cx="38" cy="21" r="0.8" fill="#eeffff"/>
  <!-- Haughty smirk -->
  <path d="M27 27 Q32 30 37 27" fill="none" stroke="#8899bb" stroke-width="2" stroke-linecap="round"/>
  <!-- Wind turban / swirl on head -->
  <path d="M22 16 Q32 10 42 16 Q38 12 32 12 Q26 12 22 16" fill="#bbccdd" opacity="0.7"/>
  <!-- Flying orbs -->
  <circle cx="12" cy="36" r="4" fill="#99bbdd" opacity="0.6"/>
  <circle cx="52" cy="36" r="4" fill="#99bbdd" opacity="0.6"/>
