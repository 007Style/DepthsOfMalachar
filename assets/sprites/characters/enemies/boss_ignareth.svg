<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Colossal fire giant torso -->
  <rect x="16" y="32" width="64" height="48" rx="6" fill="#cc4400"/>
  <!-- Lava crack body -->
  <path d="M28 36 Q32 48 26 60 Q32 56 30 68" fill="none" stroke="#ff8800" stroke-width="3" opacity="0.8"/>
  <path d="M60 38 Q56 50 64 62" fill="none" stroke="#ffcc00" stroke-width="2.5" opacity="0.7"/>
  <path d="M48 34 Q46 52 50 64" fill="none" stroke="#ff6600" stroke-width="2" opacity="0.7"/>
  <!-- Lava glow on body -->
  <rect x="16" y="32" width="64" height="48" rx="6" fill="none" stroke="#ff6600" stroke-width="2" opacity="0.5"/>
  <!-- Giant head — magma-cracked -->
  <ellipse cx="48" cy="20" rx="26" ry="22" fill="#dd5500"/>
  <!-- Head lava cracks -->
  <path d="M36 8 Q40 16 34 22" fill="none" stroke="#ff8800" stroke-width="2" opacity="0.7"/>
  <path d="M58 8 Q56 16 62 22" fill="none" stroke="#ff8800" stroke-width="2" opacity="0.7"/>
  <!-- Eyes — molten white-hot -->
  <ellipse cx="36" cy="19" rx="8" ry="8" fill="#220000"/>
  <ellipse cx="60" cy="19" rx="8" ry="8" fill="#220000"/>
  <circle cx="36" cy="19" r="5" fill="#ff8800" opacity="0.95"/>
  <circle cx="60" cy="19" r="5" fill="#ff8800" opacity="0.95"/>
  <circle cx="36" cy="19" r="2.5" fill="#ffdd00"/>
  <circle cx="60" cy="19" r="2.5" fill="#ffdd00"/>
  <circle cx="36" cy="19" r="1" fill="#ffffff"/>
  <circle cx="60" cy="19" r="1" fill="#ffffff"/>
  <!-- Volcanic horns -->
  <polygon points="30,6 24,-4 34,8" fill="#661100"/>
  <polygon points="66,6 72,-4 62,8" fill="#661100"/>
  <!-- Lava drips from horns -->
  <circle cx="24" cy="0" r="3" fill="#ff6600" opacity="0.8"/>
  <circle cx="72" cy="0" r="3" fill="#ff6600" opacity="0.8"/>
  <!-- Burning fist left -->
  <ellipse cx="8" cy="56" rx="10" ry="12" fill="#bb3300"/>
  <circle cx="8" cy="52" r="6" fill="#ff6600" opacity="0.7"/>
  <!-- Burning fist right -->
  <ellipse cx="88" cy="56" rx="10" ry="12" fill="#bb3300"/>
  <circle cx="88" cy="52" r="6" fill="#ff6600" opacity="0.7"/>
  <!-- Legs -->
  <rect x="22" y="78" width="18" height="18" rx="2" fill="#aa3300"/>
  <rect x="56" y="78" width="18" height="18" rx="2" fill="#aa3300"/>
  <!-- Lava pool feet -->
  <ellipse cx="30" cy="95" rx="14" ry="4" fill="#ff6600" opacity="0.5"/>
  <ellipse cx="66" cy="95" rx="14" ry="4" fill="#ff6600" opacity="0.5"/>
  <!-- Fire aura ring -->
  <circle cx="48" cy="58" r="44" fill="none" stroke="#ff6600" stroke-width="2" opacity="0.25"/>
</svg>
