<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Body -->
  <rect x="18" y="28" width="28" height="24" rx="4" fill="#4a7c3f"/>
  <!-- Head -->
  <ellipse cx="32" cy="20" rx="13" ry="12" fill="#5a8c4a"/>
  <!-- Tusks -->
  <rect x="24" y="28" width="4" height="7" rx="2" fill="#f0e0b0"/>
  <rect x="36" y="28" width="4" height="7" rx="2" fill="#f0e0b0"/>
  <!-- Eyes — angry -->
  <ellipse cx="27" cy="18" rx="3" ry="3" fill="#cc2200"/>
  <ellipse cx="37" cy="18" rx="3" ry="3" fill="#cc2200"/>
  <circle cx="27" cy="18" r="1.5" fill="#1a0000"/>
  <circle cx="37" cy="18" r="1.5" fill="#1a0000"/>
  <!-- Angry brow -->
  <line x1="23" y1="13" x2="30" y2="15" stroke="#2a4a20" stroke-width="2" stroke-linecap="round"/>
  <line x1="41" y1="13" x2="34" y2="15" stroke="#2a4a20" stroke-width="2" stroke-linecap="round"/>
  <!-- Nose -->
  <ellipse cx="32" cy="22" rx="3" ry="2" fill="#3a6a30"/>
  <circle cx="30" cy="22" r="1" fill="#2a4a20"/>
  <circle cx="34" cy="22" r="1" fill="#2a4a20"/>
  <!-- Arms -->
  <rect x="8" y="30" width="10" height="8" rx="3" fill="#4a7c3f"/>
  <rect x="46" y="30" width="10" height="8" rx="3" fill="#4a7c3f"/>
  <!-- Steel gauntlets -->
  <rect x="8" y="36" width="10" height="6" rx="2" fill="#8899aa"/>
  <rect x="46" y="36" width="10" height="6" rx="2" fill="#8899aa"/>
  <!-- Legs -->
  <rect x="20" y="50" width="10" height="10" rx="2" fill="#3a6030"/>
  <rect x="34" y="50" width="10" height="10" rx="2" fill="#3a6030"/>
  <!-- Steel boots -->
  <rect x="19" y="56" width="12" height="6" rx="2" fill="#8899aa"/>
  <rect x="33" y="56" width="12" height="6" rx="2" fill="#8899aa"/>
  <!-- Belt -->
  <rect x="17" y="46" width="30" height="4" rx="1" fill="#8899aa"/>
  <rect x="29" y="44" width="6" height="8" rx="1" fill="#ccaa44"/>
</svg>
