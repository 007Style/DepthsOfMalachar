<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Tattered cloak body -->
  <path d="M20 30 Q18 52 20 58 L44 58 Q46 52 44 30 Z" fill="#2a2a33"/>
  <!-- Skull head -->
  <ellipse cx="32" cy="19" rx="11" ry="10" fill="#ddd8c4"/>
  <!-- Eye sockets — dark purple glow -->
  <ellipse cx="27" cy="18" rx="3.5" ry="3.5" fill="#1a0022"/>
  <ellipse cx="37" cy="18" rx="3.5" ry="3.5" fill="#1a0022"/>
  <circle cx="27" cy="18" r="1.8" fill="#6600cc" opacity="0.85"/>
  <circle cx="37" cy="18" r="1.8" fill="#6600cc" opacity="0.85"/>
  <!-- Nasal pit -->
  <path d="M30 22 L32 25 L34 22 Z" fill="#1a0022"/>
  <!-- Jaw teeth -->
  <rect x="24" y="26" width="16" height="3" rx="1" fill="#ccc8b4"/>
  <rect x="25" y="27" width="2.5" height="4" rx="1" fill="#ddd8c4"/>
  <rect x="29" y="27" width="2.5" height="4" rx="1" fill="#ddd8c4"/>
  <rect x="33" y="27" width="2.5" height="4" rx="1" fill="#ddd8c4"/>
  <rect x="37" y="27" width="2.5" height="4" rx="1" fill="#ddd8c4"/>
  <!-- Bone arms -->
  <rect x="9" y="28" width="11" height="5" rx="2.5" fill="#ddd8c4"/>
  <rect x="44" y="28" width="11" height="5" rx="2.5" fill="#ddd8c4"/>
  <!-- Bow arm extended -->
  <rect x="44" y="18" width="4" height="22" rx="1" fill="#8b5a20"/>
  <!-- Arrow -->
  <line x1="46" y1="14" x2="46" y2="36" stroke="#aaa080" stroke-width="1.5"/>
  <polygon points="46,12 44,17 48,17" fill="#888870"/>
  <!-- Quiver on back -->
  <rect x="14" y="26" width="5" height="14" rx="2" fill="#5a4020"/>
  <line x1="16" y1="25" x2="16" y2="22" stroke="#aaa080" stroke-width="1.5"/>
  <line x1="18" y1="25" x2="18" y2="21" stroke="#aaa080" stroke-width="1.5"/>
  <!-- Legs — bone -->
  <rect x="22" y="50" width="8" height="10" rx="2" fill="#ddd8c4"/>
  <rect x="34" y="50" width="8" height="10" rx="2" fill="#ddd8c4"/>
</svg>
