<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Baby Dragon — Legendary Fire/Light pet. Rare, powerful. -->
  <!-- Wing body -->
  <path d="M12 30 Q6 22 8 14 Q12 20 14 28 Q16 20 12 10 Q18 18 16 28 Z" fill="#3a6600" opacity="0.85"/>
  <path d="M36 30 Q42 22 40 14 Q36 20 34 28 Q32 20 36 10 Q30 18 32 28 Z" fill="#3a6600" opacity="0.85"/>
  <!-- Body -->
  <ellipse cx="24" cy="32" rx="12" ry="11" fill="#4a8a00"/>
  <!-- Scales on body -->
  <path d="M16 30 Q20 26 24 28 Q28 26 32 30" fill="none" stroke="#335500" stroke-width="1.5" opacity="0.7"/>
  <!-- Head -->
  <ellipse cx="24" cy="20" rx="11" ry="10" fill="#55aa00"/>
  <!-- Dragon snout -->
  <ellipse cx="24" cy="25" rx="5" ry="3.5" fill="#4a9500"/>
  <!-- Nostrils -->
  <circle cx="22" cy="25" r="1" fill="#2a5500"/>
  <circle cx="26" cy="25" r="1" fill="#2a5500"/>
  <!-- Eyes — gold dragon eyes -->
  <ellipse cx="19" cy="19" rx="4" ry="4" fill="#110a00"/>
  <ellipse cx="29" cy="19" rx="4" ry="4" fill="#110a00"/>
  <circle cx="19" cy="19" r="2.5" fill="#ffcc00" opacity="0.95"/>
  <circle cx="29" cy="19" r="2.5" fill="#ffcc00" opacity="0.95"/>
  <!-- Slit pupils -->
  <rect x="18.5" y="17" width="1" height="4" rx="0.5" fill="#220a00"/>
  <rect x="28.5" y="17" width="1" height="4" rx="0.5" fill="#220a00"/>
  <!-- Baby horns -->
  <polygon points="18,14 17,9 21,14" fill="#3a7700"/>
  <polygon points="30,14 31,9 27,14" fill="#3a7700"/>
  <!-- Happy baby expression -->
  <path d="M20 26 Q24 29 28 26" fill="none" stroke="#2a5500" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Small fire breath hint -->
  <circle cx="24" cy="24" r="3" fill="#ff6600" opacity="0.3"/>
  <!-- Legendary glow -->
  <circle cx="24" cy="30" r="16" fill="none" stroke="#ffcc00" stroke-width="1" opacity="0.3"/>
</svg>
