<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- THE ANCIENT — Floor 666 secret boss. Pre-cosmic horror. -->
  <!-- Formless shifting body — something that predates all elements -->
  <ellipse cx="64" cy="72" rx="44" ry="46" fill="#0a0a0a"/>
  <!-- Tendrils radiating outward -->
  <path d="M64 28 Q70 10 64 4 Q58 10 64 28 Z" fill="#1a1a1a"/>
  <path d="M80 36 Q96 20 98 12 Q88 24 80 36 Z" fill="#1a1a1a"/>
  <path d="M100 58 Q118 48 122 38 Q110 52 100 58 Z" fill="#1a1a1a"/>
  <path d="M106 82 Q124 80 126 68 Q114 78 106 82 Z" fill="#1a1a1a"/>
  <path d="M92 104 Q104 116 112 108 Q100 104 92 104 Z" fill="#1a1a1a"/>
  <path d="M64 116 Q60 128 70 126 Q68 120 64 116 Z" fill="#1a1a1a"/>
  <path d="M36 104 Q24 116 16 108 Q28 104 36 104 Z" fill="#1a1a1a"/>
  <path d="M22 82 Q4 80 2 68 Q14 78 22 82 Z" fill="#1a1a1a"/>
  <path d="M28 58 Q10 48 6 38 Q18 52 28 58 Z" fill="#1a1a1a"/>
  <path d="M48 36 Q32 20 30 12 Q40 24 48 36 Z" fill="#1a1a1a"/>
  <!-- Tendrils glow — ancient void light -->
  <circle cx="64" cy="4" r="4" fill="#660066" opacity="0.7"/>
  <circle cx="98" cy="12" r="3" fill="#440044" opacity="0.6"/>
  <circle cx="122" cy="38" r="3" fill="#440044" opacity="0.6"/>
  <circle cx="126" cy="68" r="3" fill="#550055" opacity="0.6"/>
  <circle cx="112" cy="108" r="3" fill="#440044" opacity="0.6"/>
  <circle cx="2" cy="68" r="3" fill="#440044" opacity="0.6"/>
  <circle cx="6" cy="38" r="3" fill="#440044" opacity="0.6"/>
  <circle cx="30" cy="12" r="3" fill="#440044" opacity="0.6"/>
  <!-- The Ancient's face — ancient, unknowable, dozens of eyes -->
  <!-- Ring of eyes arranged in a spiral pattern -->
  <circle cx="48" cy="54" r="5" fill="#000000"/>
  <circle cx="80" cy="54" r="5" fill="#000000"/>
  <circle cx="56" cy="44" r="4" fill="#000000"/>
  <circle cx="72" cy="44" r="4" fill="#000000"/>
  <circle cx="40" cy="66" r="4" fill="#000000"/>
  <circle cx="88" cy="66" r="4" fill="#000000"/>
  <circle cx="48" cy="80" r="4" fill="#000000"/>
  <circle cx="80" cy="80" r="4" fill="#000000"/>
  <circle cx="64" cy="86" r="5" fill="#000000"/>
  <!-- Eye pupils — all slightly different, all wrong -->
  <circle cx="48" cy="54" r="2.8" fill="#660000" opacity="0.9"/>
  <circle cx="80" cy="54" r="2.8" fill="#006600" opacity="0.9"/>
  <circle cx="56" cy="44" r="2" fill="#000066" opacity="0.9"/>
  <circle cx="72" cy="44" r="2" fill="#660066" opacity="0.9"/>
  <circle cx="40" cy="66" r="2" fill="#666600" opacity="0.9"/>
  <circle cx="88" cy="66" r="2" fill="#006666" opacity="0.9"/>
  <circle cx="48" cy="80" r="2" fill="#660033" opacity="0.9"/>
  <circle cx="80" cy="80" r="2" fill="#003366" opacity="0.9"/>
  <circle cx="64" cy="86" r="2.8" fill="#660066" opacity="0.9"/>
  <!-- Central mouth — a spiral of darkness -->
  <circle cx="64" cy="64" r="16" fill="#060606"/>
  <path d="M64 48 Q80 52 80 64 Q80 80 64 80 Q48 80 48 64 Q48 52 64 48" fill="none" stroke="#330033" stroke-width="2.5" opacity="0.8"/>
  <circle cx="64" cy="64" r="8" fill="#0d0005"/>
  <circle cx="64" cy="64" r="4" fill="#1a001a"/>
  <!-- Life-steal drain particles orbiting -->
  <circle cx="64" cy="26" r="3" fill="#880088" opacity="0.6"/>
  <circle cx="100" cy="64" r="3" fill="#880088" opacity="0.6"/>
  <circle cx="64" cy="116" r="3" fill="#880088" opacity="0.6"/>
  <circle cx="28" cy="64" r="3" fill="#880088" opacity="0.6"/>
  <!-- Void signature — floor 666 symbol -->
  <text x="54" y="100" font-size="10" fill="#660066" opacity="0.6" font-family="serif">666</text>
  <!-- Outer ring of unreality -->
  <circle cx="64" cy="72" r="62" fill="none" stroke="#330033" stroke-width="1" opacity="0.3"/>
</svg>
