<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Small imp body -->
  <ellipse cx="32" cy="38" rx="12" ry="14" fill="#cc3300"/>
  <!-- Wings -->
  <path d="M20 34 Q8 24 12 18 Q14 28 20 36 Z" fill="#aa2200" opacity="0.85"/>
  <path d="M44 34 Q56 24 52 18 Q50 28 44 36 Z" fill="#aa2200" opacity="0.85"/>
  <!-- Wing membranes -->
  <path d="M20 34 Q10 22 12 18" fill="none" stroke="#881100" stroke-width="1"/>
  <path d="M44 34 Q54 22 52 18" fill="none" stroke="#881100" stroke-width="1"/>
  <!-- Head -->
  <ellipse cx="32" cy="22" rx="11" ry="10" fill="#dd4400"/>
  <!-- Horns -->
  <polygon points="24,15 21,6 27,13" fill="#660000"/>
  <polygon points="40,15 43,6 37,13" fill="#660000"/>
  <!-- Eyes — wide mischievous yellow -->
  <ellipse cx="27" cy="21" rx="4" ry="4" fill="#ffcc00"/>
  <ellipse cx="37" cy="21" rx="4" ry="4" fill="#ffcc00"/>
  <ellipse cx="27" cy="22" rx="2" ry="2.5" fill="#1a0000"/>
  <ellipse cx="37" cy="22" rx="2" ry="2.5" fill="#1a0000"/>
  <!-- Grin -->
  <path d="M26 28 Q32 33 38 28" fill="none" stroke="#881100" stroke-width="2" stroke-linecap="round"/>
  <rect x="27" y="28" width="3" height="3" rx="0.5" fill="#ffeecc"/>
  <rect x="34" y="28" width="3" height="3" rx="0.5" fill="#ffeecc"/>
  <!-- Tail -->
  <path d="M32 52 Q40 56 44 62" fill="none" stroke="#cc3300" stroke-width="3" stroke-linecap="round"/>
  <polygon points="44,62 48,58 40,58" fill="#aa2200"/>
  <!-- Small claws -->
  <rect x="20" y="42" width="6" height="5" rx="1" fill="#bb2200"/>
  <rect x="38" y="42" width="6" height="5" rx="1" fill="#bb2200"/>
  <rect x="18" y="44" width="3" height="5" rx="1" fill="#881100"/>
  <rect x="43" y="44" width="3" height="5" rx="1" fill="#881100"/>
</svg>
