<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Rival adventurer — corrupted version of Ethari-like hero -->
  <!-- Corrupted armour — once heroic, now cracked with dark energy -->
  <rect x="22" y="32" width="52" height="40" rx="5" fill="#2a3344"/>
  <!-- Corruption cracks on armour -->
  <path d="M32 36 Q34 46 30 52" fill="none" stroke="#8800ff" stroke-width="2" opacity="0.8"/>
  <path d="M60 38 Q58 48 62 54" fill="none" stroke="#8800ff" stroke-width="1.5" opacity="0.7"/>
  <!-- Heroic chest emblem — now corrupted -->
  <circle cx="48" cy="48" r="8" fill="#2a3344"/>
  <circle cx="48" cy="48" r="6" fill="none" stroke="#8800ff" stroke-width="2"/>
  <line x1="44" y1="44" x2="52" y2="52" stroke="#8800ff" stroke-width="2"/>
  <line x1="52" y1="44" x2="44" y2="52" stroke="#8800ff" stroke-width="2"/>
  <!-- Head — human but marked by corruption -->
  <ellipse cx="48" cy="20" rx="16" ry="15" fill="#cc9966"/>
  <!-- Battle-scarred face -->
  <!-- Scar across left eye -->
  <line x1="32" y1="14" x2="38" y2="22" stroke="#aa5544" stroke-width="2"/>
  <!-- Eyes — one normal, one corrupted void purple -->
  <ellipse cx="38" cy="19" rx="4" ry="4" fill="#1a1100"/>
  <ellipse cx="58" cy="19" rx="4" ry="4" fill="#110011"/>
  <circle cx="38" cy="19" r="2.5" fill="#996633"/>  <!-- Normal eye -->
  <circle cx="58" cy="19" r="2.5" fill="#aa00ff" opacity="0.95"/>  <!-- Corrupted eye -->
  <!-- Grim determined mouth -->
  <path d="M40 27 Q48 30 56 27" fill="none" stroke="#994422" stroke-width="1.5"/>
  <!-- Wild hair -->
  <path d="M32 8 Q36 4 40 8 Q44 2 48 8 Q52 4 56 8 Q60 2 64 8 L64 14 Q56 10 48 14 Q40 10 32 14 Z" fill="#442211"/>
  <!-- Dual weapon arms -->
  <!-- Sword right -->
  <rect x="74" y="18" width="6" height="36" rx="2" fill="#6688aa"/>
  <rect x="70" y="28" width="16" height="4" rx="1" fill="#88aacc"/>
  <!-- Dagger left -->
  <rect x="16" y="26" width="5" height="26" rx="2" fill="#554422"/>
  <polygon points="18.5,24 16,30 21,30" fill="#776644"/>
  <!-- Legs — in battle stance -->
  <rect x="26" y="70" width="14" height="16" rx="2" fill="#2a3344"/>
  <rect x="56" y="70" width="14" height="16" rx="2" fill="#2a3344"/>
  <!-- Boots -->
  <rect x="24" y="82" width="18" height="8" rx="2" fill="#1a2233"/>
  <rect x="54" y="82" width="18" height="8" rx="2" fill="#1a2233"/>
  <!-- Corruption aura -->
  <circle cx="48" cy="52" r="42" fill="none" stroke="#8800ff" stroke-width="1.5" opacity="0.2"/>
</svg>
