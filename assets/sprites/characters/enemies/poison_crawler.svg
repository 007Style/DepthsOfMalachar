<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Segmented caterpillar body -->
  <ellipse cx="32" cy="46" rx="22" ry="10" fill="#4a8a2a"/>
  <ellipse cx="32" cy="46" rx="22" ry="10" fill="none" stroke="#2a5a10" stroke-width="1.5" stroke-dasharray="4,4"/>
  <!-- Segments -->
  <ellipse cx="14" cy="46" rx="8" ry="9" fill="#3a7a1a"/>
  <ellipse cx="22" cy="47" rx="8" ry="9" fill="#4a8a2a"/>
  <ellipse cx="32" cy="47" rx="8" ry="9" fill="#3a7a1a"/>
  <ellipse cx="42" cy="47" rx="8" ry="9" fill="#4a8a2a"/>
  <ellipse cx="50" cy="46" rx="8" ry="9" fill="#3a7a1a"/>
  <!-- Head segment -->
  <ellipse cx="54" cy="40" rx="9" ry="9" fill="#5a9a2a"/>
  <!-- Eyes — compound toxic green -->
  <ellipse cx="56" cy="38" rx="3.5" ry="3.5" fill="#0a1a00"/>
  <ellipse cx="60" cy="40" rx="3" ry="3" fill="#0a1a00"/>
  <circle cx="56" cy="38" r="2" fill="#88ff00" opacity="0.9"/>
  <circle cx="60" cy="40" r="1.5" fill="#88ff00" opacity="0.9"/>
  <!-- Mandibles -->
  <path d="M54 46 Q57 50 52 52" stroke="#2a5a10" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M58 46 Q61 50 64 50" stroke="#2a5a10" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Poison drip trail -->
  <ellipse cx="14" cy="56" rx="5" ry="3" fill="#66dd00" opacity="0.6"/>
  <ellipse cx="8" cy="58" rx="4" ry="2" fill="#44bb00" opacity="0.5"/>
  <ellipse cx="4" cy="60" rx="3" ry="2" fill="#33aa00" opacity="0.4"/>
  <!-- Legs — many small -->
  <line x1="16" y1="52" x2="12" y2="58" stroke="#2a5a10" stroke-width="1.5"/>
  <line x1="22" y1="53" x2="20" y2="59" stroke="#2a5a10" stroke-width="1.5"/>
  <line x1="32" y1="53" x2="30" y2="59" stroke="#2a5a10" stroke-width="1.5"/>
  <line x1="42" y1="53" x2="42" y2="59" stroke="#2a5a10" stroke-width="1.5"/>
  <line x1="50" y1="52" x2="52" y2="58" stroke="#2a5a10" stroke-width="1.5"/>
  <line x1="16" y1="41" x2="12" y2="35" stroke="#2a5a10" stroke-width="1.5"/>
  <line x1="22" y1="40" x2="20" y2="34" stroke="#2a5a10" stroke-width="1.5"/>
  <line x1="32" y1="40" x2="30" y2="34" stroke="#2a5a10" stroke-width="1.5"/>
  <line x1="42" y1="40" x2="42" y2="34" stroke="#2a5a10" stroke-width="1.5"/>
  <line x1="50" y1="41" x2="52" y2="35" stroke="#2a5a10" stroke-width="1.5"/>
</svg>
