<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Robe body -->
  <path d="M16 30 Q14 52 18 58 L46 58 Q50 52 48 30 Z" fill="#8b3a10"/>
  <!-- Head -->
  <ellipse cx="32" cy="20" rx="12" ry="11" fill="#5a8c4a"/>
  <!-- Horned headdress -->
  <polygon points="20,12 18,2 24,10" fill="#cc7700"/>
  <polygon points="44,12 46,2 40,10" fill="#cc7700"/>
  <!-- Eyes — glowing fire -->
  <ellipse cx="27" cy="19" rx="3" ry="3" fill="#ff8800"/>
  <ellipse cx="37" cy="19" rx="3" ry="3" fill="#ff8800"/>
  <circle cx="27" cy="19" r="1.5" fill="#ffee00"/>
  <circle cx="37" cy="19" r="1.5" fill="#ffee00"/>
  <!-- Tusks small -->
  <rect x="26" y="27" width="3" height="5" rx="1.5" fill="#f0e0b0"/>
  <rect x="35" y="27" width="3" height="5" rx="1.5" fill="#f0e0b0"/>
  <!-- Staff arm -->
  <rect x="46" y="22" width="5" height="30" rx="2" fill="#7a5020"/>
  <!-- Fireball on staff -->
  <circle cx="48" cy="20" r="6" fill="#ff6600" opacity="0.8"/>
  <circle cx="48" cy="20" r="4" fill="#ffcc00" opacity="0.9"/>
  <circle cx="48" cy="20" r="2" fill="#ffffff"/>
  <!-- Other arm -->
  <rect x="13" y="30" width="5" height="14" rx="2" fill="#8b3a10"/>
  <!-- Fire runes on robe -->
  <text x="24" y="44" font-size="8" fill="#ff6600" font-family="serif">✦</text>
  <text x="31" y="50" font-size="8" fill="#ff8800" font-family="serif">✦</text>
  <!-- Legs/hem -->
  <ellipse cx="32" cy="58" rx="14" ry="4" fill="#6b2a00"/>
</svg>
