<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Armour body — rusted steel -->
  <rect x="18" y="28" width="28" height="22" rx="3" fill="#555566"/>
  <!-- Ribcage visible through gaps -->
  <line x1="25" y1="32" x2="25" y2="46" stroke="#888899" stroke-width="1.5"/>
  <line x1="32" y1="32" x2="32" y2="46" stroke="#888899" stroke-width="1.5"/>
  <line x1="39" y1="32" x2="39" y2="46" stroke="#888899" stroke-width="1.5"/>
  <!-- Skull head -->
  <ellipse cx="32" cy="19" rx="12" ry="11" fill="#e8e0cc"/>
  <!-- Dark eye sockets — glowing purple -->
  <ellipse cx="27" cy="18" rx="4" ry="4" fill="#220033"/>
  <ellipse cx="37" cy="18" rx="4" ry="4" fill="#220033"/>
  <circle cx="27" cy="18" r="2" fill="#9922ff" opacity="0.9"/>
  <circle cx="37" cy="18" r="2" fill="#9922ff" opacity="0.9"/>
  <!-- Nasal cavity -->
  <path d="M30 23 L32 26 L34 23 Z" fill="#220033"/>
  <!-- Jaw / teeth -->
  <rect x="22" y="26" width="20" height="4" rx="1" fill="#d8d0bc"/>
  <rect x="24" y="28" width="3" height="5" rx="1" fill="#e8e0cc"/>
  <rect x="28" y="28" width="3" height="5" rx="1" fill="#e8e0cc"/>
  <rect x="33" y="28" width="3" height="5" rx="1" fill="#e8e0cc"/>
  <rect x="37" y="28" width="3" height="5" rx="1" fill="#e8e0cc"/>
  <!-- Arms — bone -->
  <rect x="8" y="30" width="10" height="6" rx="3" fill="#e8e0cc"/>
  <rect x="46" y="30" width="10" height="6" rx="3" fill="#e8e0cc"/>
  <!-- Sword arm -->
  <rect x="50" y="22" width="4" height="20" rx="1" fill="#888899"/>
  <rect x="46" y="30" width="12" height="3" rx="1" fill="#aaaacc"/>
  <!-- Legs — bone -->
  <rect x="21" y="50" width="9" height="10" rx="2" fill="#e8e0cc"/>
  <rect x="34" y="50" width="9" height="10" rx="2" fill="#e8e0cc"/>
  <!-- Resurrection glow -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="#9922ff" stroke-width="1" opacity="0.4"/>
</svg>
