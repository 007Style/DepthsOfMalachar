<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Translucent spectral body -->
  <ellipse cx="32" cy="40" rx="16" ry="20" fill="#aaccee" opacity="0.5"/>
  <!-- Ethereal shroud trails -->
  <path d="M20 50 Q16 58 18 64" fill="none" stroke="#88aacc" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
  <path d="M32 56 Q32 62 30 64" fill="none" stroke="#88aacc" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
  <path d="M44 50 Q48 58 46 64" fill="none" stroke="#88aacc" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
  <!-- Ice-rimed outline -->
  <ellipse cx="32" cy="40" rx="16" ry="20" fill="none" stroke="#cceeff" stroke-width="1.5" opacity="0.8"/>
  <!-- Head / skull shape — barely visible -->
  <ellipse cx="32" cy="22" rx="13" ry="12" fill="#bbddee" opacity="0.7"/>
  <!-- Hollow eye sockets — icy pale blue -->
  <ellipse cx="26" cy="21" rx="5" ry="5" fill="#0a1a22"/>
  <ellipse cx="38" cy="21" rx="5" ry="5" fill="#0a1a22"/>
  <circle cx="26" cy="21" r="3" fill="#66ddff" opacity="0.9"/>
  <circle cx="38" cy="21" r="3" fill="#66ddff" opacity="0.9"/>
  <circle cx="26" cy="21" r="1.2" fill="#eeffff"/>
  <circle cx="38" cy="21" r="1.2" fill="#eeffff"/>
  <!-- Frozen scream mouth -->
  <ellipse cx="32" cy="29" rx="4" ry="3" fill="#0a1a22"/>
  <line x1="29" y1="28" x2="29" y2="32" stroke="#66ddff" stroke-width="1" opacity="0.6"/>
  <line x1="32" y1="27" x2="32" y2="31" stroke="#66ddff" stroke-width="1" opacity="0.6"/>
  <line x1="35" y1="28" x2="35" y2="32" stroke="#66ddff" stroke-width="1" opacity="0.6"/>
  <!-- Spectral arms reaching -->
  <path d="M18 36 Q8 30 6 24" fill="none" stroke="#aaccee" stroke-width="5" opacity="0.5" stroke-linecap="round"/>
  <path d="M46 36 Q56 30 58 24" fill="none" stroke="#aaccee" stroke-width="5" opacity="0.5" stroke-linecap="round"/>
  <!-- Ice crystals on body -->
  <polygon points="28,44 30,38 32,44 30,50" fill="#cceeff" opacity="0.7"/>
  <polygon points="35,42 37,36 39,42 37,48" fill="#cceeff" opacity="0.6"/>
  <!-- Frost aura -->
  <circle cx="32" cy="36" r="22" fill="none" stroke="#66ddff" stroke-width="1" opacity="0.25"/>
</svg>
