<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Massive rotting body — bloated, necrotic flesh -->
  <rect x="18" y="34" width="60" height="44" rx="8" fill="#4a3a2a"/>
  <!-- Rotting texture cracks -->
  <path d="M26 40 Q30 50 24 58" fill="none" stroke="#2a1a10" stroke-width="2" opacity="0.6"/>
  <path d="M50 36 Q54 48 48 58" fill="none" stroke="#2a1a10" stroke-width="2" opacity="0.6"/>
  <path d="M68 42 Q64 52 70 62" fill="none" stroke="#2a1a10" stroke-width="2" opacity="0.6"/>
  <!-- Maggot/green pus spots -->
  <circle cx="32" cy="50" r="5" fill="#6a8a20" opacity="0.7"/>
  <circle cx="60" cy="44" r="4" fill="#6a8a20" opacity="0.6"/>
  <circle cx="46" cy="66" r="6" fill="#5a7a10" opacity="0.6"/>
  <!-- Giant skull head — larger than a normal skeleton -->
  <ellipse cx="48" cy="22" rx="22" ry="20" fill="#d8d0bb"/>
  <!-- Cracked skull seam -->
  <line x1="48" y1="4" x2="48" y2="30" stroke="#aaa090" stroke-width="2.5" opacity="0.5"/>
  <!-- Hollow eye sockets — blazing sickly green -->
  <ellipse cx="36" cy="20" rx="7" ry="7" fill="#1a1a00"/>
  <ellipse cx="60" cy="20" rx="7" ry="7" fill="#1a1a00"/>
  <circle cx="36" cy="20" r="4" fill="#88cc00" opacity="0.95"/>
  <circle cx="60" cy="20" r="4" fill="#88cc00" opacity="0.95"/>
  <circle cx="36" cy="20" r="2" fill="#ccff44"/>
  <circle cx="60" cy="20" r="2" fill="#ccff44"/>
  <!-- Nasal pit -->
  <path d="M44 27 L48 32 L52 27 Z" fill="#1a1a00"/>
  <!-- Warlord jaw — broken teeth -->
  <rect x="30" y="34" width="36" height="6" rx="2" fill="#c8c0ab"/>
  <rect x="32" y="36" width="4" height="8" rx="1" fill="#d8d0bb"/>
  <rect x="38" y="36" width="4" height="8" rx="1" fill="#d8d0bb"/>
  <rect x="50" y="36" width="4" height="9" rx="1" fill="#d8d0bb"/>
  <rect x="58" y="36" width="3" height="7" rx="1" fill="#d8d0bb"/>
  <!-- Rusty great sword arm -->
  <rect x="75" y="24" width="8" height="48" rx="2" fill="#664422"/>
  <rect x="70" y="36" width="18" height="4" rx="1" fill="#884422"/>
  <rect x="76" y="20" width="6" height="14" rx="2" fill="#aa5533"/>
  <!-- Shield arm -->
  <ellipse cx="14" cy="54" rx="12" ry="16" fill="#445566"/>
  <ellipse cx="14" cy="54" rx="9" ry="12" fill="#556677"/>
  <circle cx="14" cy="54" r="4" fill="#888899"/>
  <!-- Bone legs -->
  <rect x="24" y="76" width="16" height="16" rx="2" fill="#c8c0ab"/>
  <rect x="56" y="76" width="16" height="16" rx="2" fill="#c8c0ab"/>
  <!-- Crown of rust -->
  <polygon points="36,4 40,12 48,6 56,12 60,4 64,10 68,4 60,2 48,0 36,2 32,4 36,10" fill="#886622"/>
</svg>
