<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dark steel armour body — mimicking player -->
  <rect x="17" y="27" width="30" height="25" rx="4" fill="#3a3a44"/>
  <!-- Armour details — chest plate -->
  <rect x="22" y="29" width="20" height="14" rx="2" fill="#4a4a55"/>
  <!-- Corrupted rune glow on chest — mirror symbol -->
  <circle cx="32" cy="36" r="5" fill="none" stroke="#8800ff" stroke-width="1.5" opacity="0.8"/>
  <line x1="29" y1="33" x2="35" y2="39" stroke="#8800ff" stroke-width="1" opacity="0.8"/>
  <line x1="35" y1="33" x2="29" y2="39" stroke="#8800ff" stroke-width="1" opacity="0.8"/>
  <!-- Corrupted helmet head -->
  <ellipse cx="32" cy="19" rx="13" ry="12" fill="#44445a"/>
  <!-- Visor slit — cursed purple glow -->
  <rect x="22" y="17" width="20" height="5" rx="2" fill="#1a1a22"/>
  <rect x="23" y="17.5" width="18" height="4" rx="1.5" fill="#6600cc" opacity="0.9"/>
  <!-- Horns on helmet -->
  <rect x="22" y="10" width="4" height="10" rx="2" transform="rotate(-15,24,15)" fill="#3a3a44"/>
  <rect x="38" y="10" width="4" height="10" rx="2" transform="rotate(15,40,15)" fill="#3a3a44"/>
  <!-- Arms in guard pose -->
  <rect x="7" y="28" width="10" height="8" rx="3" fill="#3a3a44"/>
  <rect x="47" y="28" width="10" height="8" rx="3" fill="#3a3a44"/>
  <!-- Shield on left arm -->
  <ellipse cx="8" cy="36" rx="6" ry="8" fill="#334455"/>
  <ellipse cx="8" cy="36" rx="4" ry="6" fill="#445566"/>
  <circle cx="8" cy="36" r="2" fill="#aaaacc"/>
  <!-- Mimic sword — same as player's -->
  <rect x="50" y="22" width="4" height="20" rx="1" fill="#8899bb"/>
  <rect x="47" y="29" width="12" height="3" rx="1" fill="#aaaacc"/>
  <!-- Legs -->
  <rect x="20" y="50" width="10" height="10" rx="2" fill="#3a3a44"/>
  <rect x="34" y="50" width="10" height="10" rx="2" fill="#3a3a44"/>
  <!-- Boot plating -->
  <rect x="19" y="56" width="12" height="6" rx="2" fill="#4a4a5a"/>
  <rect x="33" y="56" width="12" height="6" rx="2" fill="#4a4a5a"/>
</svg>
