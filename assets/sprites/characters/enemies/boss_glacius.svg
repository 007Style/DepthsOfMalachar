<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Glacial armour body — crystalline ice plates -->
  <rect x="14" y="30" width="68" height="50" rx="6" fill="#99ccee"/>
  <!-- Ice plate facets -->
  <polygon points="14,30 40,30 30,50 14,50" fill="#aaddff" opacity="0.7"/>
  <polygon points="56,30 82,30 82,50 68,50" fill="#aaddff" opacity="0.7"/>
  <polygon points="20,60 48,60 40,80 14,80" fill="#88bbdd" opacity="0.6"/>
  <polygon points="56,60 82,60 82,80 64,80" fill="#88bbdd" opacity="0.6"/>
  <!-- Ice armour outline -->
  <rect x="14" y="30" width="68" height="50" rx="6" fill="none" stroke="#cceeff" stroke-width="2" opacity="0.8"/>
  <!-- Frost crown/head -->
  <ellipse cx="48" cy="18" rx="24" ry="20" fill="#aaccdd"/>
  <!-- Ice crystal crown -->
  <polygon points="30,2 34,12 38,2 44,14 48,0 52,14 58,2 62,12 66,2 64,10 48,-2 32,10" fill="#cceeff"/>
  <!-- Cold regal eyes — pale blue -->
  <ellipse cx="36" cy="17" rx="7" ry="7" fill="#0a2233"/>
  <ellipse cx="60" cy="17" rx="7" ry="7" fill="#0a2233"/>
  <circle cx="36" cy="17" r="4" fill="#aaddff" opacity="0.95"/>
  <circle cx="60" cy="17" r="4" fill="#aaddff" opacity="0.95"/>
  <circle cx="36" cy="17" r="2" fill="#eeffff"/>
  <circle cx="60" cy="17" r="2" fill="#eeffff"/>
  <!-- Frozen expression — contemptuous -->
  <path d="M38 26 Q48 30 58 26" fill="none" stroke="#0a2233" stroke-width="2"/>
  <!-- Ice lance arm -->
  <rect x="80" y="10" width="8" height="60" rx="3" fill="#aaccdd"/>
  <polygon points="84,8 80,16 88,16" fill="#ddeeff"/>
  <!-- Frost shield arm -->
  <polygon points="2,36 14,26 14,66 2,56" fill="#88aacc"/>
  <polygon points="4,40 14,32 14,60 4,52" fill="#99bbdd"/>
  <!-- Legs — ice block -->
  <rect x="20" y="78" width="18" height="16" rx="2" fill="#88aacc"/>
  <rect x="58" y="78" width="18" height="16" rx="2" fill="#88aacc"/>
  <!-- Frost mist at feet -->
  <ellipse cx="48" cy="94" rx="32" ry="5" fill="#aaccee" opacity="0.4"/>
  <!-- Frozen aura ring -->
  <circle cx="48" cy="56" r="44" fill="none" stroke="#66aacc" stroke-width="1.5" opacity="0.25"/>
</svg>
