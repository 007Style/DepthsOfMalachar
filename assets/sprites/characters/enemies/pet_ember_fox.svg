<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Ember Fox — Fire element pet. Stage 1. Small fluffy fox with fire tail -->
  <!-- Body -->
  <ellipse cx="24" cy="30" rx="12" ry="10" fill="#dd6622"/>
  <!-- Head -->
  <ellipse cx="24" cy="20" rx="9" ry="8" fill="#ee7733"/>
  <!-- Pointy ears -->
  <polygon points="17,14 15,8 21,14" fill="#ee7733"/>
  <polygon points="31,14 33,8 27,14" fill="#ee7733"/>
  <polygon points="17,14 16,10 20,14" fill="#ffaaaa"/>
  <polygon points="31,14 32,10 28,14" fill="#ffaaaa"/>
  <!-- Eyes — bright amber -->
  <circle cx="21" cy="19" r="2.5" fill="#111100"/>
  <circle cx="27" cy="19" r="2.5" fill="#111100"/>
  <circle cx="21" cy="19" r="1.5" fill="#ffcc00"/>
  <circle cx="27" cy="19" r="1.5" fill="#ffcc00"/>
  <!-- Nose -->
  <ellipse cx="24" cy="23" rx="2" ry="1.5" fill="#331100"/>
  <!-- Fire tail -->
  <path d="M36 34 Q42 28 40 20 Q36 26 34 32 Q38 26 36 18 Q32 28 36 34 Z" fill="#ff6600" opacity="0.9"/>
  <path d="M36 34 Q41 28 39 22 Q36 28 34 32 Z" fill="#ffcc00" opacity="0.8"/>
  <!-- Legs -->
  <ellipse cx="18" cy="38" rx="4" ry="3" fill="#cc5511"/>
  <ellipse cx="30" cy="38" rx="4" ry="3" fill="#cc5511"/>
</svg>
