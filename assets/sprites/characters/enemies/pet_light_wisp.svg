<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Light Wisp — Legendary Light element pet. Ghost of Aelion's light. -->
  <!-- Main orb -->
  <circle cx="24" cy="24" r="16" fill="#ffffee" opacity="0.8"/>
  <circle cx="24" cy="24" r="12" fill="#ffffcc" opacity="0.85"/>
  <circle cx="24" cy="24" r="8" fill="#ffffff" opacity="0.9"/>
  <!-- Core glow -->
  <circle cx="24" cy="24" r="4" fill="#ffeeaa"/>
  <circle cx="24" cy="24" r="2" fill="#ffffff"/>
  <!-- Face — serene, ancient -->
  <ellipse cx="20" cy="22" rx="3" ry="3" fill="#ccaa44"/>
  <ellipse cx="28" cy="22" rx="3" ry="22" fill="#ccaa44"/>
  <ellipse cx="20" cy="22" rx="1.8" ry="2" fill="#aa8822"/>
  <ellipse cx="28" cy="22" rx="1.8" ry="2" fill="#aa8822"/>
  <!-- Peaceful mouth -->
  <path d="M21 28 Q24 30 27 28" fill="none" stroke="#ccaa44" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Light rays emanating -->
  <line x1="24" y1="6" x2="24" y2="2" stroke="#ffeeaa" stroke-width="1.5" opacity="0.6"/>
  <line x1="36" y1="12" x2="39" y2="9" stroke="#ffeeaa" stroke-width="1.5" opacity="0.5"/>
  <line x1="40" y1="24" x2="44" y2="24" stroke="#ffeeaa" stroke-width="1.5" opacity="0.5"/>
  <line x1="36" y1="36" x2="39" y2="39" stroke="#ffeeaa" stroke-width="1.5" opacity="0.5"/>
  <line x1="12" y1="12" x2="9" y2="9" stroke="#ffeeaa" stroke-width="1.5" opacity="0.5"/>
  <line x1="8" y1="24" x2="4" y2="24" stroke="#ffeeaa" stroke-width="1.5" opacity="0.5"/>
  <line x1="12" y1="36" x2="9" y2="39" stroke="#ffeeaa" stroke-width="1.5" opacity="0.5"/>
  <!-- Outer legendary aura -->
  <circle cx="24" cy="24" r="22" fill="none" stroke="#ffddaa" stroke-width="1" opacity="0.4"/>
</svg>
